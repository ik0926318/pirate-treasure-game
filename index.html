
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海賊王の秘宝｜第1の試練</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px 12px;
  background:radial-gradient(circle at top,#344b55,#101b29 75%);
  color:#f5dfb2;
  font-family:Georgia,"Yu Mincho",serif;
  text-align:center;
}
.game{
  max-width:460px;
  margin:auto;
  padding:25px 16px;
  background:#1b2934;
  border:2px solid #bc9552;
  border-radius:17px;
  box-shadow:0 0 35px #0008;
}
small{
  color:#d6b678;
  letter-spacing:3px;
}
h1{
  color:#f1c775;
  font-size:26px;
}
.paper{
  margin:20px 0;
  padding:20px 12px;
  border-radius:10px;
  background:#ead5a8;
  color:#392719;
  line-height:2;
  box-shadow:inset 0 0 15px #8b612d33;
}
.compass{
  position:relative;
  width:250px;
  height:250px;
  margin:24px auto;
  border:9px solid #ac8245;
  border-radius:50%;
  background:radial-gradient(circle,#f4e5c2,#d2b47b);
  box-shadow:0 7px 20px #0009,inset 0 0 22px #6c491b55;
}
.ring{
  position:absolute;
  inset:14px;
  border:2px solid #997341;
  border-radius:50%;
}
.mark{
  position:absolute;
  color:#56391b;
  font-size:23px;
  font-weight:bold;
}
.n{
  top:5px;
  left:50%;
  transform:translateX(-50%);
}
.e{
  right:11px;
  top:50%;
  transform:translateY(-50%);
}
.s{
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
}
.w{
  left:11px;
  top:50%;
  transform:translateY(-50%);
}
.needle{
  position:absolute;
  inset:0;
  transform:rotate(0deg);
  transition:transform .35s ease;
}
.north{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-100%);
  width:0;
  height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-bottom:79px solid #b73d31;
}
.south{
  position:absolute;
  left:50%;
  top:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-top:72px solid #50483c;
}
.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:24px;
  height:24px;
  border-radius:50%;
  background:#d6a75c;
  border:3px solid #65431d;
  box-shadow:0 2px 5px #0005;
}
.controls{
  display:flex;
  justify-content:center;
  gap:12px;
}
button{
  border:0;
  border-radius:9px;
  padding:13px 17px;
  background:#d4a655;
  color:#291c0c;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:active{
  transform:scale(.97);
}
#status{
  min-height:55px;
  margin:18px 0;
  line-height:1.8;
}
#confirm{
  width:100%;
}
#result{
  display:none;
  margin-top:23px;
  padding:20px 15px;
  background:#ead5a8;
  color:#392719;
  border-radius:12px;
  line-height:2;
  animation:appear .6s ease;
}
#result h2{
  color:#80511f;
}
#result h1{
  font-size:58px;
  color:#8d531b;
  margin:4px 0;
}
.message{
  margin-top:18px;
  padding:15px 10px;
  border:2px dashed #9e7544;
  border-radius:9px;
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>
<div class="game">

<small>MISSION 01</small>
<h1>☠️ 狂った羅針盤</h1>

<div class="paper">
  📜 船長の航海日誌<br><br>
  「太陽が沈む場所から始めよ。<br>
  次に北の星を仰ぎ、<br>
  最後に朝日を迎えよ。」<br><br>
  羅針盤を正しい順番に合わせよ。
</div>

<div class="compass">
  <div class="ring"></div>

  <div class="mark n">N</div>
  <div class="mark e">E</div>
  <div class="mark s">S</div>
  <div class="mark w">W</div>

  <div class="needle" id="needle">
    <div class="north"></div>
    <div class="south"></div>
  </div>

  <div class="center"></div>
</div>

<div class="controls">
  <button onclick="turn(-1)">◀ 左へ</button>
  <button onclick="turn(1)">右へ ▶</button>
</div>

<p id="status">現在の方角：北</p>

<button id="confirm" onclick="choose()">
  ⚓ この方角に決める
</button>

<div id="result">
  <h2>🏴‍☠️ 第1の試練突破！</h2>

  <p>見事だ、若き海賊よ！<br>
  最初の秘宝を手に入れたな。</p>

  <p>🔐 宝箱の1桁目は</p>
  <h1>9</h1>
  <p>この数字を忘れるな！</p>

  <div class="message">
    <strong>📜 海賊王からの新たな指令</strong>
    <p>
      「次なる秘宝は、<br>
      戦いの装いを解き、<br>
      新たな姿へと変わる場所に眠る。
    </p>
    <p>
      その場所に隠された印を探し出せ！」
    </p>
  </div>
</div>

</div>

<script>
let direction=0;
let rotation=0;
let step=0;

const names=["北","東","南","西"];
const correct=[3,0,1];

function turn(n){
  if(step===3)return;

  direction=(direction+n+4)%4;
  rotation+=n*90;

  document.getElementById("needle").style.transform=
    "rotate("+rotation+"deg)";

  document.getElementById("status").textContent=
    "現在の方角："+names[direction];
}

function choose(){
  if(step===3)return;

  const status=document.getElementById("status");

  if(direction===correct[step]){
    step++;

    if(step===3){
      status.textContent="⚓ 3つの方角がそろった！";
      document.getElementById("result").style.display="block";
      document.getElementById("confirm").disabled=true;
    }else{
      status.textContent=
        "⚓ 正しい方角だ！ 残り"+(3-step)+"つ。";
    }
  }else{
    step=0;
    status.textContent=
      "☠️ 方角が違う！ 最初から挑戦しよう。";
  }
}
</script>
</body>
</html>
