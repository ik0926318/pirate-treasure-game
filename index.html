
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海賊王の秘宝｜第1の試練</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:24px 14px;min-height:100vh;
 background:radial-gradient(circle,#354c4b,#101b25 75%);
 color:#f5e4bd;text-align:center;
 font-family:Georgia,"Yu Mincho",serif
}
.game{
 max-width:480px;margin:auto;padding:25px 17px;
 border:2px solid #bd9653;border-radius:15px;
 background:#101d27;box-shadow:0 0 35px #0008
}
h1{color:#f2c777;font-size:29px}
h2{color:#eac586;font-size:21px}
p{line-height:1.8}
.small{color:#d4b989;font-size:13px}
.paper{
 background:#e9d5ab;color:#3b2918;
 border:5px double #a78148;border-radius:7px;
 padding:18px;margin:20px 0
}
.wheel{
 width:270px;height:270px;margin:20px auto;
 position:relative;touch-action:none;
 user-select:none;cursor:grab
}
.ring{
 position:absolute;inset:0;border-radius:50%;
 border:9px solid #bb8a42;
 background:repeating-conic-gradient(
 #e4c68b 0deg 13.846deg,
 #d3ac69 13.846deg 27.692deg);
 box-shadow:0 4px 18px #0008
}
.letter{
 position:absolute;left:50%;top:50%;
 font:bold 15px Georgia;color:#392614;
 transform-origin:center;
}
.inner{
 position:absolute;inset:58px;border-radius:50%;
 background:#233a42;border:6px solid #e7c57f;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 color:#f9d992;pointer-events:none
}
.pointer{font-size:30px;color:#f6d47e}
button{
 border:0;border-radius:9px;padding:14px;
 background:linear-gradient(#f8d78f,#b98938);
 color:#281b0c;font-size:16px;font-weight:bold;
 cursor:pointer
}
.controls{display:flex;gap:10px;justify-content:center}
.controls button{min-width:85px}
input{
 width:100%;padding:14px;font-size:22px;
 border-radius:8px;border:2px solid #c8a362;
 text-align:center;background:#fff8e8
}
.submit{width:100%;margin-top:13px}
#result{margin-top:20px;line-height:2;font-weight:bold}
</style>
</head>
<body>
<div class="game">
 <div style="font-size:42px">☠️</div>
 <p class="small">PIRATE TREASURE HUNT</p>
 <h1>海賊王の秘宝</h1>
 <p>MISSION 01 — 回転する暗号盤</p>

 <div class="paper">
  <h2>📜 船長の遺言</h2>
  <p>「文字を3つ進めて秘密を隠した。<br>
  真実を知りたければ、時を巻き戻せ。」</p>
  <p>暗号：<strong style="font-size:30px">QLQH</strong></p>
  <p>暗号盤を回し、隠された数字を探せ。</p>
 </div>

 <div class="pointer">▼</div>
 <div class="wheel" id="wheel" aria-label="回転する暗号盤">
  <div class="ring" id="ring"></div>
  <div class="inner">
   <div class="small">暗号盤の位置</div>
   <div id="shift" style="font-size:34px">0</div>
   <div class="small">解読結果</div>
   <div id="decoded" style="font-size:26px">QLQH</div>
  </div>
 </div>

 <div class="controls">
  <button onclick="rotate(-1)">↶ 左へ</button>
  <button onclick="rotate(1)">右へ ↷</button>
 </div>
 <p class="small">暗号盤を指で左右に動かすこともできる</p>

 <p>🔐 解読した数字を入力せよ</p>
 <input id="answer" type="text" inputmode="numeric"
 placeholder="数字を入力">
 <button class="submit" onclick="checkAnswer()">
 ⚔️ 封印を解除する
 </button>
 <div id="result" aria-live="polite"></div>
</div>

<script>
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const cipher="QLQH";
const ring=document.getElementById("ring");
const wheel=document.getElementById("wheel");
let position=0;

for(let i=0;i<26;i++){
 const el=document.createElement("span");
 el.className="letter";
 el.textContent=alphabet[i];
 const angle=i*360/26;
 const radius=111;
 const rad=(angle-90)*Math.PI/180;
 el.style.left=`calc(50% + ${Math.cos(rad)*radius}px)`;
 el.style.top=`calc(50% + ${Math.sin(rad)*radius}px)`;
 el.style.transform="translate(-50%,-50%)";
 ring.appendChild(el);
}

function rotate(n){
 position=(position+n+26)%26;
 const angle=position*360/26;
 ring.style.transform=`rotate(${angle}deg)`;
 document.getElementById("shift").textContent=position;
 document.getElementById("decoded").textContent=
  [...cipher].map(c=>
   alphabet[(alphabet.indexOf(c)-position+26)%26]
  ).join("");
}

let startX=null;
wheel.addEventListener("pointerdown",e=>{
 startX=e.clientX;
 wheel.setPointerCapture(e.pointerId);
});
wheel.addEventListener("pointerup",e=>{
 if(startX===null)return;
 const diff=e.clientX-startX;
 if(Math.abs(diff)>15){
  rotate(Math.sign(diff)*Math.max(1,Math.round(Math.abs(diff)/35)));
 }
 startX=null;
});

function checkAnswer(){
 const answer=document.getElementById("answer").value
  .trim().replace(/[０-９]/g,c=>
   String.fromCharCode(c.charCodeAt(0)-65248));
 const result=document.getElementById("result");

 if(position===3 && answer==="9"){
  result.style.color="#9aefb4";
  result.innerHTML=
   "🔓 第1の試練クリア！<br>"+
   "💎 宝箱の1桁目は【9】<br>"+
   "🧭 次の手がかりは、姿を整える場所にある。<br>"+
   "更衣室へ向かえ！";
 }else{
  result.style.color="#ff9c8d";
  result.textContent="☠️ 封印は解けない。暗号盤を調べ直せ！";
 }
}
</script>
</body>
</html>
