
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1問｜海賊王の秘宝</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 15px;
  font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  color: #39230e;
  background:
    linear-gradient(#24150888,#24150888),
    repeating-linear-gradient(30deg,#70502f,#70502f 8px,#644426 9px);
}
.container {
  max-width: 650px;
  margin: auto;
}
header {
  text-align: center;
  color: #ffe1a0;
  margin-bottom: 24px;
}
header h1 {
  font-size: clamp(27px,7vw,42px);
  margin: 8px 0;
}
.paper {
  background: #f8e4b6;
  border: 8px solid #b88a4a;
  border-radius: 15px;
  padding: 25px 20px;
  box-shadow: 0 12px 30px #0008;
}
.tag {
  display: inline-block;
  background: #8e231e;
  color: white;
  padding: 9px 20px;
  border-radius: 5px;
  font-weight: bold;
}
h2 {
  text-align: center;
  font-size: 27px;
}
.scene {
  width: 100%;
  margin: 16px 0;
  border-radius: 12px;
  overflow: hidden;
  background: #d9b477;
}
.scene svg { display:block; width:100%; height:auto; }
.story {
  font-size: 17px;
  line-height: 2;
}
.riddle {
  padding: 18px;
  background: #e9c991;
  border-left: 5px solid #8e5b2d;
  line-height: 2.1;
  font-size: 17px;
}
.question {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
}
input {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: 2px solid #a67c43;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #743817;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}
#result {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
<header>
  <div>🏴‍☠️ ANNIVERSARY EVENT</div>
  <h1>海賊王の秘宝</h1>
  <div>〜失われた宝の謎〜</div>
</header>

<main class="paper">
  <span class="tag">第1問｜難易度：普通</span>
  <h2>海賊の航海日誌</h2>

  <div class="scene">
    <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
      <rect width="600" height="300" fill="#d6a86a"/>
      <path d="M90 60 Q180 15 265 85 T490 80 L515 235 Q410 260 300 225 T85 245 Z"
        fill="#f5dda2" stroke="#8d5c32" stroke-width="5"/>
      <path d="M125 200 Q175 100 260 155 T415 125"
        stroke="#79502a" stroke-width="5"
        stroke-dasharray="10 12" fill="none"/>
      <g transform="translate(460 78)">
        <circle r="49" fill="#b87c34" stroke="#58361a" stroke-width="5"/>
        <circle r="35" fill="#f6df9f" stroke="#58361a" stroke-width="2"/>
        <path d="M0 -32 L10 0 L0 32 L-10 0Z" fill="#873d23"/>
        <path d="M-32 0H32 M0 -32V32" stroke="#58361a" stroke-width="2"/>
        <text x="0" y="-56" text-anchor="middle" fill="#42280d" font-size="17">N</text>
      </g>
      <g transform="translate(115 85)">
        <rect x="-48" y="-20" width="96" height="75" rx="7"
          fill="#8c491d" stroke="#f5cb55" stroke-width="6"/>
        <path d="M-48 2H48 M-15 -20V55 M15 -20V55"
          stroke="#f5cb55" stroke-width="7"/>
        <path d="M-48 -20 Q0 -80 48 -20"
          fill="#c18b36" stroke="#f5cb55" stroke-width="6"/>
      </g>
      <g fill="#347c48">
        <path d="M315 180 l-25 -38 24 15 12 -35 8 37 28 -15 -26 35Z"/>
        <path d="M320 180V240" stroke="#765029" stroke-width="9"/>
      </g>
      <g transform="translate(460 220)">
        <path d="M-75 15H75L45 45H-45Z" fill="#70401f"/>
        <path d="M0 -105V15" stroke="#6a3c1c" stroke-width="6"/>
        <path d="M-5 -100L-5 0H-65Z" fill="#fff0cb"/>
        <path d="M8 -85V0H65Z" fill="#fff0cb"/>
      </g>
      <text x="300" y="280" text-anchor="middle"
        font-size="16" fill="#714b28">THE LOST TREASURE MAP</text>
    </svg>
  </div>

  <p class="story">
    海賊が残した日誌には、こう書かれていた。
  </p>

  <div class="riddle">
    「私は進む道を示す。<br>
    針を持っているが、縫い物はしない。<br>
    海の上で迷ったとき、海賊たちは私を頼る。」
  </div>

  <p class="question">さて、私は何だろう？</p>

  <input id="answer" placeholder="答えを入力してください"
    autocomplete="off">
  <button onclick="checkAnswer()">答え合わせ</button>
  <div id="result" aria-live="polite"></div>
</main>
</div>

<script>
function checkAnswer() {
  const answer = document.getElementById("answer").value
    .normalize("NFKC")
    .replace(/[\s　]/g, "")
    .toLowerCase();

  const correct = [
    "コンパス", "こんぱす",
    "方位磁針", "ほういじしん",
    "羅針盤", "らしんばん"
  ];

  const result = document.getElementById("result");

  if (correct.includes(answer)) {
    result.style.color = "#17652d";
    result.innerHTML =
      "🎉 正解！<br>宝への道がひとつ開かれた！";
  } else if (!answer) {
    result.style.color = "#743817";
    result.textContent = "答えを入力してね！";
  } else {
    result.style.color = "#a12222";
    result.textContent =
      "残念！もう一度、日誌を読み解こう。";
  }
}

document.getElementById("answer")
  .addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.isComposing) {
      checkAnswer();
    }
  });
</script>
</body>
</html>
