
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第3問｜船乗りを導く見えない力</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      min-height: 100vh;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
      color: #3c2a1c;
      background:
        radial-gradient(circle at top, #344f60, #101f2b 75%);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: #f5dfaa;
      margin-bottom: 22px;
    }

    .header .mark {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .header .mission {
      font-size: 13px;
      letter-spacing: 4px;
      color: #d9bd7a;
    }

    .header h1 {
      font-size: 26px;
      line-height: 1.5;
      margin: 12px 0;
    }

    .paper {
      position: relative;
      padding: 30px 23px;
      border: 3px solid #a67a3e;
      border-radius: 9px;
      background:
        radial-gradient(circle at 20% 20%, #fff4d4, transparent 55%),
        linear-gradient(135deg, #f3e0b4, #e4c995);
      box-shadow: 0 12px 35px rgba(0,0,0,.4);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(121, 78, 34, .35);
      border-radius: 3px;
      pointer-events: none;
    }

    .illustration {
      text-align: center;
      font-size: 62px;
      margin: 0 0 14px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      color: #8a6134;
      margin-bottom: 12px;
    }

    .question-title {
      text-align: center;
      font-size: 21px;
      margin: 0 0 24px;
      padding-bottom: 15px;
      border-bottom: 1px solid #b58d57;
    }

    .story {
      font-size: 16px;
      line-height: 2.15;
      margin-bottom: 24px;
    }

    .story p {
      margin: 0 0 14px;
    }

    .question {
      font-weight: bold;
      text-align: center;
      font-size: 18px;
      line-height: 1.8;
      margin: 28px 0 20px;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      text-align: center;
      color: #3c2a1c;
      background: #fffaf0;
      border: 2px solid #a67a3e;
      border-radius: 5px;
      outline: none;
    }

    input:focus {
      border-color: #69461d;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      font-size: 17px;
      font-weight: bold;
      color: #fff4d5;
      background: linear-gradient(#76502b, #493017);
      border: 2px solid #b99152;
      border-radius: 5px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.99);
    }

    #result {
      margin-top: 22px;
      text-align: center;
    }

    .success {
      padding: 22px 15px;
      border: 2px solid #987039;
      background: rgba(255, 250, 224, .75);
      border-radius: 7px;
    }

    .success h2 {
      font-size: 24px;
      margin: 0 0 12px;
      color: #69501f;
    }

    .number {
      font-family: Georgia, serif;
      font-size: 80px;
      font-weight: bold;
      color: #8b581f;
      line-height: 1.3;
      text-shadow: 1px 2px 0 #eacb82;
    }

    .success p {
      font-size: 15px;
      line-height: 1.9;
      margin: 8px 0;
    }

    .error {
      color: #922f25;
      font-weight: bold;
      line-height: 1.8;
    }

    .footer {
      text-align: center;
      color: #d7c18e;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 22px;
      }

      .paper {
        padding: 25px 18px;
      }

      .story {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <main class="container">

    <header class="header">
      <div class="mark">🏴‍☠️</div>
      <div class="mission">FINAL MISSION</div>
      <h1>第3問<br>船乗りを導く見えない力</h1>
    </header>

    <section class="paper">

      <div class="illustration">⛵🌊</div>
      <div class="subtitle">THE LAST RIDDLE</div>
      <h2 class="question-title">最後の航海の謎</h2>

      <div class="story">
        <p>
          航海に欠かせない「あるもの」があります。
        </p>

        <p>
          それは目には見えませんが、存在を感じることができます。
        </p>

        <p>
          時には船乗りの味方となり、時には大きな脅威となります。
        </p>

        <p>
          強すぎても、弱すぎても、航海を困難にします。
        </p>

        <p>
          海の上だけでなく、陸の上でもその存在を感じることができます。
        </p>
      </div>

      <div class="question">
        この「あるもの」とは何でしょう？
      </div>

      <form id="answerForm">
        <input
          type="text"
          id="answer"
          placeholder="答えを入力"
          autocomplete="off"
          required
        >

        <button type="submit">
          答えを確認する
        </button>
      </form>

      <div id="result" aria-live="polite"></div>

    </section>

    <div class="footer">
      PIRATE TREASURE HUNT
    </div>

  </main>

  <script>
    const form = document.getElementById("answerForm");
    const answerInput = document.getElementById("answer");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const answer = answerInput.value
        .trim()
        .normalize("NFKC")
        .replace(/\s/g, "");

      if (
        answer === "風" ||
        answer === "かぜ" ||
        answer === "カゼ"
      ) {
        result.innerHTML = `
          <div class="success">
            <h2>⚓ 正解！ ⚓</h2>
            <p>最後の謎を解き明かした！</p>
            <p>宝箱の暗証番号・3桁目は</p>
            <div class="number">2</div>
            <p>
              これで3つの数字がそろった！<br>
              フロントの宝箱に向かい、<br>
              暗証番号を入力しよう！
            </p>
          </div>
        `;
      } else {
        result.innerHTML = `
          <div class="error">
            まだ正解ではないようだ…。<br>
            もう一度考えてみよう！
          </div>
        `;
      }
    });
  </script>

</body>
</html>
