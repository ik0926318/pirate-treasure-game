
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最終試練｜海賊王の秘宝</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 18px;
  font-family: Georgia, "Yu Mincho", serif;
  color: #f8e6ba;
  text-align: center;
  background: radial-gradient(circle, #374b4a, #101c25 75%);
}

.game {
  max-width: 480px;
  margin: auto;
  padding: 28px 20px;
  border: 2px solid #b9934f;
  border-radius: 14px;
  background: #0f1a22;
  box-shadow: 0 0 35px #0009;
}

h1 { color: #f3c76e; }

.mission {
  color: #d4ad64;
  letter-spacing: 2px;
}

.story { line-height: 2; }

.puzzle {
  margin: 25px 0;
  padding: 22px;
  background: #e7d2a2;
  color: #352515;
  border: 5px double #9b7842;
  border-radius: 5px;
}

.puzzle strong {
  display: block;
  font-size: 29px;
  margin: 15px 0;
  letter-spacing: 3px;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 22px;
  text-align: center;
  border-radius: 8px;
  border: 2px solid #c7a35e;
  background: #fff9e9;
  color: #251a0c;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: 0;
  border-radius: 8px;
  background: linear-gradient(#f6d486, #b78330);
  color: #251a0c;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 24px;
  line-height: 2;
  font-weight: bold;
}

.success { color: #91efb1; }
.error { color: #ff9b8c; }
</style>
</head>

<body>
<div class="game">
  <div style="font-size:44px">🏴‍☠️</div>
  <p>⚓ 海賊王の秘宝 ⚓</p>
  <p class="mission">MISSION 03 — FINAL</p>
  <h1>海賊王の最後の試練</h1>

  <p class="story">
    ついに最後の航海へたどり着いた。<br>
    海賊王が残した最後の謎を解き、<br>
    宝箱の封印を解き放て！
  </p>

  <div class="puzzle">
    📜 海賊王の暗号
    <strong>3・6・12・24・？</strong>
    <p>
      数字にはある法則が隠されている。<br>
      最後の数字を導き出せ！
    </p>
  </div>

  <p>🔐 最後の答えを入力せよ</p>

  <input
    type="text"
    id="answer"
    placeholder="数字を入力"
    inputmode="numeric"
  >

  <button onclick="checkAnswer()">
    ⚔️ 最後の封印を解除する
  </button>

  <div id="result" aria-live="polite"></div>
</div>

<script>
function checkAnswer() {
  const answer = document.getElementById("answer").value
    .trim()
    .replace(/[０-９]/g, c =>
      String.fromCharCode(c.charCodeAt(0) - 65248)
    );

  const result = document.getElementById("result");

  if (answer === "48") {
    result.className = "success";
    result.innerHTML =
      "🎉 最終試練クリア！<br>" +
      "💎 宝箱の暗証番号・3桁目は【8】<br><br>" +
      "🏴‍☠️ 3つの数字を順番に並べよ！<br>" +
      "🔐 宝箱を開け、財宝を手に入れろ！";
  } else {
    result.className = "error";
    result.textContent =
      "☠️ 不正解！ 海賊王の暗号をもう一度解け！";
  }
}
</script>
</body>
</html>
